<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EXPERIMENT-10 · ARBITRATION MODAL</title>
<!-- exp-10 -->

<style>
:root{
  --bg:#0A0A0A;--orange:#F26400;--amber:#F49F09;--mint:#52F29A;--red:#C20C0C;
  --red-hi:#E2280F;--teal:#0C6C80;--blue:#5090D0;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --cond:"Arial Narrow","Avenir Next Condensed","Helvetica Neue",Arial,sans-serif;
  --jp:"Hiragino Mincho ProN","Yu Mincho",serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#000;overflow:hidden;font-family:var(--mono);text-transform:uppercase;
  display:flex;align-items:center;justify-content:center}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:99;
  background:
    repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px),
    radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.6) 100%)}

/* double frame: thin outer + thick inner */
.modal{
  width:min(92vw,1000px);height:min(90vh,640px);
  border:1px solid var(--orange);padding:5px;
  box-shadow:0 0 14px rgba(242,100,0,.3);
  background:var(--bg);
}
.modal-inner{
  border:3px solid var(--orange);height:100%;position:relative;
  padding:22px 28px;overflow:hidden;
}

/* kanji headers with teal double bars */
.hdr{position:absolute;top:18px}
.hdr.left{left:24px}.hdr.right{right:24px;text-align:right}
.hdr .jp{font-family:var(--jp);font-weight:800;font-size:44px;color:var(--orange);
  letter-spacing:.1em;line-height:1;text-transform:none;
  text-shadow:0 0 6px rgba(242,100,0,.4)}
.hdr .bars{height:10px;border-top:3px solid var(--teal);border-bottom:3px solid var(--teal);margin-top:6px}
.hdr .en{font-family:var(--cond);font-weight:700;font-size:11px;letter-spacing:.3em;
  color:var(--amber);margin-top:4px}

.meta{position:absolute;left:24px;top:118px;font-size:12px;line-height:1.35;color:var(--red-hi)}
.meta .code{font-family:var(--cond);font-weight:700;font-size:26px;letter-spacing:.06em}
.meta b{color:var(--amber);font-weight:400}

.stamp{
  position:absolute;right:24px;top:118px;border:2px solid var(--red-hi);color:var(--red-hi);
  font-weight:700;font-size:14px;padding:3px 12px;border-radius:2px;
  text-shadow:0 0 5px currentColor;animation:blink 1s steps(1) infinite;
}
.stamp.settled{animation:none}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

/* arena: circle + rotated slots */
.arena{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);width:420px;height:340px}
.arena svg{position:absolute;inset:0;overflow:visible}
.slot{
  position:absolute;width:150px;height:150px;border:2px solid var(--orange);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:var(--bg);
}
.slot .num{font-family:var(--cond);font-weight:700;font-size:74px;line-height:.9;color:transparent}
.slot .nm{font-family:var(--cond);font-weight:700;font-size:15px;letter-spacing:.06em;color:transparent}
.slot.lit{background:var(--mint);border-color:var(--mint)}
.slot.lit .num,.slot.lit .nm{color:#0A0A0A}
.slot.denied{background:var(--red);border-color:var(--red)}
.slot.denied .num,.slot.denied .nm{color:#0A0A0A}
.s0{left:135px;top:0;transform:rotate(0deg)}
.s1{left:22px;top:150px;transform:rotate(-14deg)}
.s2{left:248px;top:150px;transform:rotate(12deg)}
.hublabel{
  position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);
  font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:24px;
  letter-spacing:.22em;color:var(--orange);text-shadow:0 0 6px rgba(242,100,0,.4);
}
.verdictline{
  position:absolute;left:0;right:0;bottom:16px;text-align:center;
  font-family:var(--cond);font-weight:700;font-size:16px;letter-spacing:.3em;color:var(--amber);
}
@media (prefers-reduced-motion:reduce){.stamp{animation:none}}
</style>
</head>
<body>

<div class="modal">
  <div class="modal-inner">

    <div class="hdr left">
      <div class="jp">提案</div>
      <div class="bars"></div>
      <div class="en">Proposal</div>
    </div>
    <div class="hdr right">
      <div class="jp">裁定</div>
      <div class="bars"></div>
      <div class="en">Ruling</div>
    </div>

    <div class="meta">
      <span class="code">CODE:<span id="code">402</span></span><br>
      FILE:<b>ARBITER_SYS</b><br>
      EXTENTION:<b id="ext">1024</b><br>
      EX_MODE:<b>ON</b><br>
      PRIORITY:<b>A--</b>
    </div>

    <div class="stamp" id="stamp">審査中 · REVIEW</div>

    <div class="arena">
      <svg viewBox="0 0 420 340">
        <circle cx="210" cy="180" r="118" fill="none" stroke="#F26400" stroke-width="1.5"/>
      </svg>
      <div class="slot s0" id="slot-0"><span class="num"></span><span class="nm"></span></div>
      <div class="slot s1" id="slot-1"><span class="num"></span><span class="nm"></span></div>
      <div class="slot s2" id="slot-2"><span class="num"></span><span class="nm"></span></div>
      <div class="hublabel">ARBITER</div>
    </div>

    <div class="verdictline" id="verdict">AWAITING BALLOTS</div>

  </div>
</div>

<script>
"use strict";
/* Arbitration: three rotated slots vote on a proposal. Each slot lights
   with a giant ballot number; consensus resolves to PASSED/REJECTED.
   Single-value focus, snap states, blinking stamp while pending. */

const NAMES=["LYRA·1","CYGNUS·2","AQUILA·3"];
const slots=[0,1,2].map(i=>{
  const s=document.getElementById("slot-"+i);
  s.querySelector(".nm").textContent=NAMES[i];
  return s;
});
const stamp=document.getElementById("stamp");
const verdict=document.getElementById("verdict");
const codeEl=document.getElementById("code");
const extEl=document.getElementById("ext");
const REDUCED=matchMedia("(prefers-reduced-motion: reduce)").matches;
let code=402;

function resetSlots(){
  for(const s of slots){
    s.classList.remove("lit","denied");
    s.querySelector(".num").textContent="";
  }
}

function round(){
  code++;
  codeEl.textContent=code;
  extEl.textContent=1<<(6+code%6);
  stamp.textContent="審査中 · REVIEW";
  stamp.classList.remove("settled");
  stamp.style.color="var(--red-hi)";stamp.style.borderColor="var(--red-hi)";
  verdict.textContent="AWAITING BALLOTS";
  resetSlots();

  const order=[0,1,2].sort(()=>Math.random()-.5);
  const votes=[];
  order.forEach((idx,k)=>{
    setTimeout(()=>{
      const s=slots[idx];
      const yes=Math.random()<.72;
      votes.push(yes);
      const cls=yes?"lit":"denied";
      const ballot=String(1+Math.floor(Math.random()*3));
      const apply=()=>{
        s.classList.add(cls);
        s.querySelector(".num").textContent=ballot;
      };
      if(REDUCED){apply();}
      else{ /* 3-frame flicker snap */
        apply();
        setTimeout(()=>s.classList.remove(cls),60);
        setTimeout(()=>s.classList.add(cls),120);
      }
      if(votes.length===3){
        setTimeout(()=>{
          const passed=votes.filter(v=>v).length>=2;   /* majority rule */
          stamp.classList.add("settled");
          stamp.textContent=passed?"可決 · PASSED":"否決 · REJECTED";
          const col=passed?"var(--mint)":"var(--red-hi)";
          stamp.style.color=col;stamp.style.borderColor=col;
          verdict.textContent=passed
            ?"MOTION CARRIED — 2/3 MAJORITY"
            :"MOTION FAILS — RETURNED TO PROPOSER";
        },800);
      }
    },900+k*1500);
  });
}

round();
setInterval(round,11000);
</script>
</body>
</html>
